name: Deploy QEMU Web to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'runtime/**'
      - 'tools/build.mjs'
      - 'tests/smoke.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build pinned browser bundle
        run: npm run build
      - name: Check publishable files
        run: npm test
      - name: Boot generated firmware in Chrome
        run: npm run test:browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
